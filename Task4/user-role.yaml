apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-reader
subjects:
  - kind: ServiceAccount
    name: analytics
    namespace: analytics
roleRef:
  kind: ClusterRole
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-binding
subjects:
  - kind: ServiceAccount
    name: backend-dev
    namespace: devs
roleRef:
  kind: Role
  name: developer
  apiGroup: rbac.authorization.k8s.io